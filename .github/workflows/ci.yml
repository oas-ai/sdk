name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  license:
    uses: oas-ai/.github/.github/workflows/license-check.yml@main
  protobuf:
    uses: oas-ai/.github/.github/workflows/protobuf-ci.yml@main
    with:
      enable-breaking-check: true
  rust:
    uses: oas-ai/.github/.github/workflows/rust-ci.yml@main
